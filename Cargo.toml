[workspace]
resolver = "3"
members = ["harness", "problems/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
harness = { path = "harness" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Symbols make `perf` and `cargo asm` readable without changing the code.
debug = 1

[profile.bench]
inherits = "release"
